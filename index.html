<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* ✅ Responsive camera button */
      #shutter-btn {
        position: fixed;
        bottom: 3vh;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(255, 255, 255, 0.9);
        color: black;
        font-size: clamp(20px, 5vw, 28px);
        border: none;
        border-radius: 50%;
        width: clamp(60px, 14vw, 90px);
        height: clamp(60px, 14vw, 90px);
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        touch-action: manipulation;
      }

      #shutter-btn:active {
        transform: translateX(-50%) scale(0.95);
        background-color: rgba(230, 230, 230, 0.9);
      }

      /* Flash effect */
      #flash {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 9998;
      }
    </style>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      id="scene"
      embedded
      gesture-detector
    >
      <a-assets>
        <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
      </a-assets>

      <a-marker
        id="animated-marker"
        type="pattern"
        preset="custom"
        url="assets/marker.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
        id="markerA"
      >
        <a-entity
          id="bowser-model"
          scale="0.7025287485037903 0.7025287485037903 0.7025287485037903"
          animation-mixer="loop: repeat"
          gltf-model="#animated-asset"
          class="clickable"
          gesture-handler
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- 📸 Camera Button -->
    <button id="shutter-btn">📸</button>
    <div id="flash"></div>

    <script>
      const button = document.getElementById("shutter-btn");
      const flash = document.getElementById("flash");

      button.addEventListener("click", takeSnapshot);
      button.addEventListener("touchend", takeSnapshot);

      function takeSnapshot(event) {
        event.preventDefault();

        const scene = document.querySelector("a-scene");
        const video = document.querySelector("video"); // AR.js camera video feed
        const rendererCanvas = scene?.renderer?.domElement;

        if (!video || !rendererCanvas) {
          alert("Camera not ready yet!");
          return;
        }

        // Flash effect
        flash.style.opacity = 0.8;
        setTimeout(() => (flash.style.opacity = 0), 200);

        // Create a temp canvas matching video size
        const tempCanvas = document.createElement("canvas");
        const width = rendererCanvas.width;
        const height = rendererCanvas.height;
        tempCanvas.width = width;
        tempCanvas.height = height;
        const context = tempCanvas.getContext("2d");

        // Draw video (background)
        context.drawImage(video, 0, 0, width, height);

        // Draw 3D layer (overlay)
        context.drawImage(rendererCanvas, 0, 0, width, height);

        // Convert to image
        const imageData = tempCanvas.toDataURL("image/png");

        // Trigger download
        const link = document.createElement("a");
        link.href = imageData;
        link.download = `AR_Snapshot_${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>
  </body>
</html>
