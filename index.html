<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #shutter-btn {
            position: fixed;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            width: clamp(60px, 14vw, 90px);
            height: clamp(60px, 14vw, 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 6vw, 30px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
            border: none;
            z-index: 9999;
            touch-action: manipulation;
            user-select: none;
        }
        #flash {
            position: fixed; inset: 0; background:white;
            opacity:0; pointer-events:none;
            transition:opacity .25s ease; z-index:9998;
        }
        #flash.active { opacity:0.8; }
    </style>
</head>

<body>
    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        id="scene"
        embedded
        gesture-detector
    >
        <a-assets>
            <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
        </a-assets>

        <a-marker
            id="animated-marker"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <a-entity
                id="bowser-model"
                scale="0.7 0.7 0.7"
                animation-mixer="loop: repeat"
                gltf-model="#animated-asset"
                class="clickable"
                gesture-handler
            ></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <button id="shutter-btn">📸</button>
    <div id="flash"></div>

    <script>
        const btn = document.getElementById('shutter-btn');
        const flash = document.getElementById('flash');

        async function takeScreenshot() {
            // Flash effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 200);

            // Hide button so it doesn't appear in screenshot
            btn.style.display = 'none';

            // Allow render to update
            await new Promise(r => setTimeout(r, 150));

            // Capture entire body (full visible screen)
            html2canvas(document.body, {useCORS:true, logging:false, scrollX:0, scrollY:0})
                .then(canvas => {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = `Full_Screen_${Date.now()}.png`;
                    link.click();

                    // Restore button
                    btn.style.display = 'flex';
                })
                .catch(err => {
                    console.error('Screenshot failed:', err);
                    btn.style.display = 'flex';
                });
        }

        btn.addEventListener('click', takeScreenshot);
        btn.addEventListener('touchend', e => { e.preventDefault(); takeScreenshot(); });
    </script>
</body>
</html>
