<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <!-- html2canvas included as a fallback (won't be used unless necessary) -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      /* shutter button styling (responsive) */
      #shutter-btn {
        position: fixed;
        bottom: 3vh;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.95);
        border-radius: 50%;
        width: clamp(60px, 14vw, 90px);
        height: clamp(60px, 14vw, 90px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(22px, 6vw, 30px);
        box-shadow: 0 6px 14px rgba(0,0,0,0.35);
        border: none;
        z-index: 9999;
        touch-action: manipulation;
        user-select: none;
      }
      #shutter-btn:active { transform: translateX(-50%) scale(0.96); }

      /* flash overlay to simulate camera flash */
      #flash {
        position: fixed; inset: 0; background: white;
        opacity: 0; pointer-events: none; transition: opacity .22s ease;
        z-index: 9998;
      }
      #flash.on { opacity: 0.8; }
    </style>
  </head>

  <body>
    <!-- NOTE: preserveDrawingBuffer and alpha set so we can read WebGL pixels -->
    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true; preserveDrawingBuffer: true; alpha: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      id="scene"
      embedded
      gesture-detector
    >
      <a-assets>
        <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
      </a-assets>

      <a-marker
        id="animated-marker"
        type="pattern"
        preset="custom"
        url="assets/marker.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
      >
        <a-entity
          id="bowser-model"
          scale="0.7025287485037903 0.7025287485037903 0.7025287485037903"
          animation-mixer="loop: repeat"
          gltf-model="#animated-asset"
          class="clickable"
          gesture-handler
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- shutter + flash -->
    <button id="shutter-btn" aria-label="Take photo">📸</button>
    <div id="flash" role="presentation"></div>

    <script>
      (function () {
        const btn = document.getElementById('shutter-btn');
        const flash = document.getElementById('flash');

        // both click and touch
        btn.addEventListener('click', snapshotHandler);
        btn.addEventListener('touchend', (e) => { e.preventDefault(); snapshotHandler(); });

        async function snapshotHandler() {
          // hide UI
          btn.style.visibility = 'hidden';

          // tiny delay so hide is rendered
          await new Promise(r => setTimeout(r, 70));

          // try direct merge (video + WebGL)
          try {
            const dataURL = await captureMergedFrame();
            triggerDownload(dataURL);
          } catch (err) {
            console.warn('Direct capture failed, falling back to html2canvas:', err);
            try {
              const dataURL = await captureWithHtml2Canvas();
              triggerDownload(dataURL);
            } catch (err2) {
              console.error('Fallback also failed:', err2);
              alert('Could not capture snapshot on this device/browser.');
            }
          } finally {
            // restore UI
            btn.style.visibility = 'visible';
          }
        }

        // find a visible camera video element
        function findCameraVideo() {
          const videos = Array.from(document.querySelectorAll('video'));
          // prefer the video with dimensions and visible
          let candidate = videos.find(v =>
            v.readyState >= 2 &&
            v.videoWidth > 0 &&
            v.videoHeight > 0 &&
            window.getComputedStyle(v).visibility !== 'hidden' &&
            v.offsetParent !== null
          );
          if (!candidate) candidate = videos.find(v => v.readyState >= 2 && v.videoWidth > 0 && v.videoHeight > 0);
          if (!candidate) candidate = videos[0] || null;
          return candidate;
        }

        // Merge video + renderer canvas into one canvas and return dataURL
        async function captureMergedFrame() {
          const scene = document.querySelector('a-scene');
          if (!scene || !scene.renderer) throw new Error('A-Frame renderer not ready');

          const rendererCanvas = scene.renderer.domElement;
          if (!rendererCanvas) throw new Error('Renderer canvas not found');

          // ensure the renderer has pixels available (preserveDrawingBuffer must be true)
          // backing buffer size (in CSS pixels * DPR) is in .width/.height
          const targetWidth = rendererCanvas.width;
          const targetHeight = rendererCanvas.height;

          if (!targetWidth || !targetHeight) throw new Error('Renderer canvas has invalid size');

          // find video feed
          const video = findCameraVideo();
          if (!video) throw new Error('Camera video element not found');

          // create temp canvas with device-pixel accurate backing size
          const tmp = document.createElement('canvas');
          tmp.width = targetWidth;
          tmp.height = targetHeight;
          const ctx = tmp.getContext('2d');

          // flash effect
          flash.classList.add('on');
          setTimeout(()=>flash.classList.remove('on'), 180);

          // draw the camera video scaled-to-cover (preserve aspect and fill viewport)
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          if (vw > 0 && vh > 0) {
            // scale to cover (center crop)
            const scale = Math.max(targetWidth / vw, targetHeight / vh);
            const sWidth = Math.round(targetWidth / scale);
            const sHeight = Math.round(targetHeight / scale);
            const sx = Math.round(Math.max(0, (vw - sWidth) / 2));
            const sy = Math.round(Math.max(0, (vh - sHeight) / 2));
            // drawImage(source, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
            try {
              ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
            } catch (e) {
              // some browsers can throw on drawImage(video) intermittently — fallback to simple draw
              console.warn('drawImage(video) with crop failed, fallback drawImage(video):', e);
              ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
            }
          } else {
            // no video dimensions yet
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, targetWidth, targetHeight);
          }

          // draw the WebGL canvas on top
          try {
            // If the A-Frame renderer was created with alpha:true, the WebGL canvas should composite
            ctx.drawImage(rendererCanvas, 0, 0, targetWidth, targetHeight);
          } catch (e) {
            // Drawing the renderer canvas may fail on some platforms due to security / compositing
            throw new Error('Failed to draw renderer canvas: ' + e.message);
          }

          // final image
          return tmp.toDataURL('image/png');
        }

        // fallback using html2canvas capturing the a-scene element (captures composition as rendered)
        async function captureWithHtml2Canvas() {
          const sceneEl = document.querySelector('a-scene');
          if (!sceneEl) throw new Error('a-scene not found for html2canvas fallback');

          flash.classList.add('on');
          // small delay to allow flash to show and UI hidden
          await new Promise(r => setTimeout(r, 120));
          const canvas = await html2canvas(sceneEl, {useCORS: true, backgroundColor: null, logging: false});
          flash.classList.remove('on');
          return canvas.toDataURL('image/png');
        }

        // download helper
        function triggerDownload(dataURL) {
          const link = document.createElement('a');
          link.href = dataURL;
          link.download = `AR_Snapshot_${Date.now()}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }
      })();
    </script>
  </body>
</html>
