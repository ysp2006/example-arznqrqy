<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-entity
                    id="bowser-model"
                    scale="0.7025287485037903 0.7025287485037903 0.7025287485037903"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <!-- 📸 Camera Shutter Button -->
        <button id="shutter-btn" 
            style="
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background-color: white;
                color: black;
                font-size: 18px;
                border: none;
                border-radius: 50%;
                width: 70px;
                height: 70px;
                box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
                cursor: pointer;
                z-index: 9999;
            ">
            📸
        </button>

        <script>
            const button = document.getElementById("shutter-btn");
            button.addEventListener("click", () => {
                const scene = document.querySelector("a-scene");

                // Ensure the renderer exists
                if (scene && scene.renderer && scene.renderer.domElement) {
                    const canvas = scene.renderer.domElement;

                    // Capture the image
                    const imageData = canvas.toDataURL("image/png");

                    // Create a temporary link to download it
                    const link = document.createElement("a");
                    link.href = imageData;
                    link.download = `AR_Snapshot_${Date.now()}.png`;
                    link.click();

                    // Optional feedback
                    alert("📷 Snapshot saved!");
                } else {
                    alert("Camera not ready yet!");
                }
            });
        </script>
    </body>
</html>
