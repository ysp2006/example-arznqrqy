<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #shutter-btn {
      position: fixed;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      width: clamp(60px, 14vw, 90px);
      height: clamp(60px, 14vw, 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 6vw, 30px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      border: none;
      z-index: 9999;
      touch-action: manipulation;
      user-select: none;
    }
    #shutter-btn:active { transform: translateX(-50%) scale(0.96); }
    #flash {
      position: fixed; inset: 0; background: white;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
      z-index: 9998;
    }
    #flash.on { opacity: 0.8; }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    renderer="logarithmicDepthBuffer: true; preserveDrawingBuffer: true; alpha: false;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    id="scene"
    embedded
    gesture-detector
  >
    <a-assets>
      <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
    </a-assets>

    <a-marker
      id="animated-marker"
      type="pattern"
      preset="custom"
      url="assets/marker.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <a-entity
        id="bowser-model"
        scale="0.7 0.7 0.7"
        animation-mixer="loop: repeat"
        gltf-model="#animated-asset"
        class="clickable"
        gesture-handler
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <button id="shutter-btn">📸</button>
  <div id="flash"></div>

  <script>
    const btn = document.getElementById('shutter-btn');
    const flash = document.getElementById('flash');

    btn.addEventListener('click', takeSnapshot);
    btn.addEventListener('touchend', e => { e.preventDefault(); takeSnapshot(); });

    function takeSnapshot() {
      const scene = document.querySelector('a-scene');
      const renderer = scene.renderer;
      if (!renderer) {
        alert('Renderer not ready');
        return;
      }

      // Flash effect
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 150);

      // Hide button before snapshot
      btn.style.visibility = 'hidden';

      setTimeout(() => {
        try {
          // Capture entire WebGL canvas (camera background + 3D objects)
          const imageData = renderer.domElement.toDataURL('image/png');

          const link = document.createElement('a');
          link.href = imageData;
          link.download = `AR_Snapshot_${Date.now()}.png`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          console.error('Snapshot failed:', err);
          alert('Unable to take snapshot on this device/browser.');
        } finally {
          // Restore button
          btn.style.visibility = 'visible';
        }
      }, 50); // short delay to allow UI to hide
    }
  </script>
</body>
</html>
